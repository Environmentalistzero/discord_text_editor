<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Discord mesajlarını Markdown biçiminde hazırlayın, önizleyin ve kopyalayın." />
    <title>Discord Metin Düzenleyici</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div>
          <p class="eyebrow">Açık kaynak araç</p>
          <h1>Discord Metin Düzenleyici</h1>
          <p class="subtitle">Metninizi biçimlendirin, canlı önizleyin ve tek tıkla kopyalayın.</p>
        </div>
        <button id="copy-button" class="primary-button" type="button">
          <span aria-hidden="true">⧉</span>
          <span>Kopyala</span>
        </button>
      </header>

      <div class="editor-grid">
        <section class="panel editor-panel" aria-label="Metin düzenleyici">
          <div class="toolbar" role="toolbar" aria-label="Biçimlendirme araçları">
            <div class="toolbar-group" aria-label="Başlıklar">
              <button class="toolbar-button heading-button" type="button" data-line-format="# " title="Başlık 1">H1</button>
              <button class="toolbar-button heading-button" type="button" data-line-format="## " title="Başlık 2">H2</button>
              <button class="toolbar-button heading-button" type="button" data-line-format="### " title="Başlık 3">H3</button>
            </div>
            <div class="toolbar-group" aria-label="Metin biçimi">
              <button class="toolbar-button" type="button" data-format="bold" title="Kalın"><strong>B</strong></button>
              <button class="toolbar-button" type="button" data-format="italic" title="İtalik"><em>I</em></button>
              <button class="toolbar-button" type="button" data-format="underline" title="Altı çizili"><u>U</u></button>
              <button class="toolbar-button" type="button" data-format="strike" title="Üstü çizili"><s>S</s></button>
              <button class="toolbar-button" type="button" data-format="spoiler" title="Spoiler">▩</button>
            </div>
            <div class="toolbar-group" aria-label="Bloklar">
              <button class="toolbar-button" type="button" data-line-format="> " title="Alıntı">❝</button>
              <button class="toolbar-button" type="button" data-format="inline-code" title="Satır içi kod">&lt;/&gt;</button>
              <button class="toolbar-button" type="button" data-format="code-block" title="Kod bloğu">{ }</button>
              <button class="toolbar-button" type="button" data-line-format="- " title="Liste">☷</button>
              <button id="link-button" class="toolbar-button" type="button" title="Bağlantı ekle">↗</button>
            </div>
            <div class="toolbar-group color-group" aria-label="Renkli kod blokları">
              <button id="color-menu-button" class="toolbar-button" type="button" aria-expanded="false">Renk ▾</button>
              <div id="color-menu" class="color-menu" hidden>
                <button type="button" data-color="red"><span class="dot red"></span>Kırmızı</button>
                <button type="button" data-color="orange"><span class="dot orange"></span>Turuncu</button>
                <button type="button" data-color="yellow"><span class="dot yellow"></span>Sarı</button>
                <button type="button" data-color="green"><span class="dot green"></span>Yeşil</button>
                <button type="button" data-color="blue"><span class="dot blue"></span>Mavi</button>
              </div>
            </div>
          </div>
          <label class="sr-only" for="editor">Discord mesajınız</label>
          <textarea id="editor" spellcheck="true" placeholder="Discord'a göndermek istediğiniz metni buraya yazın veya yapıştırın. Metni seçip araç çubuğundan biçimlendirebilirsiniz."></textarea>
        </section>

        <section class="preview-section" aria-label="Canlı önizleme">
          <h2>Discord canlı önizleme</h2>
          <div class="panel preview-panel">
            <div class="message-avatar" aria-hidden="true">D</div>
            <div class="message-content">
              <div class="message-meta"><strong>Sen</strong><span>bugün saat <time id="current-time"></time></span></div>
              <div id="preview" class="preview" aria-live="polite"></div>
            </div>
          </div>
          <p class="notice">Önizleme, yaygın Discord Markdown biçimlerini gösterir. Metniniz yalnızca tarayıcınızda işlenir.</p>
        </section>
      </div>
    </main>
  </body>
</html>
