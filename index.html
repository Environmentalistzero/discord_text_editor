<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Format Discord messages with Markdown, preview them live, and copy them in one click." />
    <title>Discord Text Editor</title>
    <link rel="stylesheet" href="assets/css/styles.css?v=3" />
    <script src="assets/js/app.js?v=3" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <div>
          <h1>Discord Text Editor</h1>
          <p class="subtitle">Format your message, preview it live, and copy it in one click.</p>
        </div>
        <button id="copy-button" class="primary-button" type="button">
          <span aria-hidden="true">⧉</span>
          <span>Copy</span>
        </button>
      </header>

      <div class="editor-grid">
        <section class="editor-section" aria-label="Text editor">
          <h2>Editor</h2>
          <div class="panel editor-panel">
            <div class="toolbar" role="toolbar" aria-label="Formatting tools">
            <div class="toolbar-group" aria-label="Headings">
              <button class="toolbar-button heading-button" type="button" data-line-format="# " title="Heading 1">H1</button>
              <button class="toolbar-button heading-button" type="button" data-line-format="## " title="Heading 2">H2</button>
              <button class="toolbar-button heading-button" type="button" data-line-format="### " title="Heading 3">H3</button>
            </div>
            <div class="toolbar-group" aria-label="Text styles">
              <button class="toolbar-button" type="button" data-format="bold" title="Bold"><strong>B</strong></button>
              <button class="toolbar-button" type="button" data-format="italic" title="Italic"><em>I</em></button>
              <button class="toolbar-button" type="button" data-format="underline" title="Underline"><u>U</u></button>
              <button class="toolbar-button" type="button" data-format="strike" title="Strikethrough"><s>S</s></button>
              <button class="toolbar-button" type="button" data-format="spoiler" title="Spoiler">▩</button>
            </div>
            <div class="toolbar-group" aria-label="Blocks">
              <button class="toolbar-button" type="button" data-line-format="> " title="Quote">❝</button>
              <button class="toolbar-button" type="button" data-format="inline-code" title="Inline code">&lt;/&gt;</button>
              <button class="toolbar-button" type="button" data-format="code-block" title="Code block">{ }</button>
              <button class="toolbar-button" type="button" data-line-format="- " title="List">☷</button>
              <button id="link-button" class="toolbar-button" type="button" title="Add link">↗</button>
            </div>
            <div class="toolbar-group color-group" aria-label="Colored code blocks">
              <button id="color-menu-button" class="toolbar-button" type="button" aria-expanded="false" title="Color through a code block">Color ▾</button>
              <div id="color-menu" class="color-menu" hidden>
                <button type="button" data-color="red"><span class="dot red"></span>Red</button>
                <button type="button" data-color="orange"><span class="dot orange"></span>Orange</button>
                <button type="button" data-color="yellow"><span class="dot yellow"></span>Yellow</button>
                <button type="button" data-color="green"><span class="dot green"></span>Green</button>
                <button type="button" data-color="blue"><span class="dot blue"></span>Blue</button>
              </div>
            </div>
            </div>
            <label class="sr-only" for="editor">Your Discord message</label>
            <textarea id="editor" spellcheck="true" placeholder="Write or paste the message you want to send to Discord. Select text and use the toolbar to format it."></textarea>
          </div>
        </section>

        <section class="preview-section" aria-label="Live preview">
          <h2>Discord live preview</h2>
          <div class="panel preview-panel">
            <div class="message-avatar" aria-hidden="true">D</div>
            <div class="message-content">
              <div class="message-meta"><strong>You</strong><span>today at <time id="current-time"></time></span></div>
              <div id="preview" class="preview" aria-live="polite"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
